<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- Dynamic Ambient Background --- */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            animation: floatAmbient 12s infinite ease-in-out;
        }
        body::after {
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(0,0,0,0) 70%);
            animation-delay: -6s;
            animation-duration: 16s;
        }
        @keyframes floatAmbient {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 40px) scale(1.2); }
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            z-index: 1;
            perspective: 1000px; /* Required for the 3D tilt JS effect */
        }

        .auth-card {
            background: rgba(25, 27, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            
            /* Enhanced Reveal Animation */
            opacity: 0;
            transform: translateY(30px);
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Staggered Entrance Animations for Content --- */
        .animate-fade {
            opacity: 0;
            animation: elementFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .del-1 { animation-delay: 0.15s; }
        .del-2 { animation-delay: 0.25s; }
        .del-3 { animation-delay: 0.35s; }
        .del-4 { animation-delay: 0.45s; }

        @keyframes elementFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #181a23;
            border: 1px solid #2d3142;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .input-group input:focus {
            outline: none;
            border-color: #6366f1;
            background: #1c1e2b;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .utilities {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }

        .utilities a {
            color: #9ca3af;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .utilities a:hover {
            color: #6366f1;
        }

        /* --- Shimmering Button Architecture --- */
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shimmerLoop 5s infinite ease-in-out;
        }

        @keyframes shimmerLoop {
            0% { left: -150%; }
            30%, 100% { left: 150%; }
        }

        .btn:hover {
            background: #4f46e5;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
            margin-left: 4px;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .auth-footer a:hover {
            color: #818cf8;
            text-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card" id="tilt-card">
            <div class="animate-fade del-1">
                <h2>Welcome back</h2>
                <p class="subtitle">Enter your details to access your account.</p>
            </div>
            
            <form action="success.html">
                <div class="input-group animate-fade del-2">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required autocomplete="email">
                </div>
                
                <div class="input-group animate-fade del-3">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="utilities animate-fade del-3">
                    <a href="#">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn animate-fade del-4">Sign In</button>
            </form>
            
            <div class="auth-footer animate-fade del-4">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <!-- JavaScript for 3D Parallax Hover Effect -->
    <script>
        const card = document.getElementById('tilt-card');
        const container = document.querySelector('.auth-container');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            
            // Get mouse position relative to the center of the card
            const x = e.clientX - rect.left - (rect.width / 2);
            const y = e.clientY - rect.top - (rect.height / 2);
            
            // Calculate rotation degrees (lower number = more subtle tilt)
            const rotateX = -(y / (rect.height / 2)) * 6;
            const rotateY = (x / (rect.width / 2)) * 6;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset positions smoothly when mouse leaves
        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            card.style.transition = 'transform 0.5s ease';
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });
    </script>
</body>
</html>
